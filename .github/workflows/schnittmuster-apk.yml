name: Schnittmuster APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'schnittmuster_app/**'
      - '.github/workflows/schnittmuster-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schnittmuster_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Restore stable signing key
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.RAETSELKIDS_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Force APK signing with stable key
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          SIGNED=build/app/outputs/flutter-apk/app-debug-stable.apk
          "$APKSIGNER" sign \
            --ks ~/.android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$APK"
          mv "$SIGNED" "$APK"

      - name: Verify APK uses restored key
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          KEY_FP=$(keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | openssl dgst -sha256 -binary | xxd -p -c 256 | tr '[:upper:]' '[:lower:]')
          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" | awk '/SHA-256 digest/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')
          echo "Keystore SHA-256: $KEY_FP"
          echo "APK SHA-256:      $APK_FP"
          test "$KEY_FP" = "$APK_FP"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schnittmuster-app-debug-apk
          path: schnittmuster_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
