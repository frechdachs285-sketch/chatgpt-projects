name: Schnittmuster APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'schnittmuster_app/**'
      - '.github/workflows/schnittmuster-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schnittmuster_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Remove generated default widget test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schnittmuster-app-debug-apk
          path: schnittmuster_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
