name: Build RätselKids debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "raetselkids/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android project
        working-directory: raetselkids
        run: bash tool/setup_android.sh

      - name: Restore verified stable debug keystore
        working-directory: raetselkids
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.RAETSELKIDS_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        working-directory: raetselkids
        run: bash tool/build_debug_apk.sh

      - name: Verify APK signature
        working-directory: raetselkids
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-debug.apk | grep -qi '4d6e090d0483423098e1e10b279811505a82110e05a16d718df03dc4910a3f7e'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raetselkids-debug-apk
          path: raetselkids/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
