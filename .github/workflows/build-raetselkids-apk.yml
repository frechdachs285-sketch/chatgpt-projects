name: Build RätselKids debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - raetselkids-mox-voice-v1.2
    paths:
      - "raetselkids/**"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.3'
          cache: true

      - name: Set up Android project
        working-directory: raetselkids
        run: bash tool/setup_android.sh

      - name: Restore stable signing key
        working-directory: raetselkids
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.RAETSELKIDS_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Restore generated Mox voice cache
        id: mox-audio-cache
        uses: actions/cache/restore@v4
        with:
          path: raetselkids/assets/audio/mox
          key: mox-audio-v1-${{ hashFiles('raetselkids/lib/data/sample_puzzles.dart', 'raetselkids/tool/generate_mox_audio.py') }}

      - name: Generate Mox voice assets
        working-directory: raetselkids
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MOX_VOICE_ID: ${{ secrets.MOX_VOICE_ID }}
        run: python3 tool/generate_mox_audio.py

      - name: Save generated Mox voice cache
        if: ${{ hashFiles('raetselkids/assets/audio/mox/manifest.json') != '' && steps.mox-audio-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: raetselkids/assets/audio/mox
          key: mox-audio-v1-${{ hashFiles('raetselkids/lib/data/sample_puzzles.dart', 'raetselkids/tool/generate_mox_audio.py') }}

      - name: Build debug APK
        working-directory: raetselkids
        run: bash tool/build_debug_apk.sh

      - name: Force APK signing with stable key
        working-directory: raetselkids
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          SIGNED=build/app/outputs/flutter-apk/app-debug-stable.apk
          "$APKSIGNER" sign \
            --ks ~/.android/debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" \
            "$APK"
          mv "$SIGNED" "$APK"

      - name: Verify APK uses restored key
        working-directory: raetselkids
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          KEY_FP=$(keytool -exportcert -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | openssl dgst -sha256 -binary | xxd -p -c 256 | tr '[:upper:]' '[:lower:]')
          APK_FP=$("$APKSIGNER" verify --print-certs "$APK" | awk '/SHA-256 digest/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]')
          echo "Keystore SHA-256: $KEY_FP"
          echo "APK SHA-256:      $APK_FP"
          test "$KEY_FP" = "$APK_FP"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: raetselkids-debug-apk
          path: raetselkids/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
