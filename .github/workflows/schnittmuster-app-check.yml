name: Schnittmuster App Check

on:
  push:
    branches:
      - schnittmuster-rock-v1
    paths:
      - 'schnittmuster_app/**'
      - '.github/workflows/schnittmuster-app-check.yml'
  pull_request:
    paths:
      - 'schnittmuster_app/**'
      - '.github/workflows/schnittmuster-app-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schnittmuster_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
